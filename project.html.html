 <!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects | My Computer World</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    background: linear-gradient(135deg, #141e30, #243b55);
}

/* NAVIGATION */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 15px;
    text-align: center;
    background: rgba(0, 0, 0, 0.65);
    box-shadow: 0 3px 15px rgba(0,0,0,0.4);
}

nav a {
    display: inline-block;
    margin: 5px 8px;
    padding: 10px 16px;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}

nav a:hover,
nav a.active {
    background: #ff9800;
    color: black;
    transform: translateY(-2px);
}

/* HERO */

.hero {
    text-align: center;
    padding: 70px 20px 45px;
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 15px;
    animation: fadeDown 1s ease;
}

.hero p {
    font-size: 18px;
    color: #ddd;
    animation: fadeUp 1s ease;
}

/* PROJECT CARDS */

.projects {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.card {
    padding: 30px 25px;
    text-align: center;
    border-radius: 20px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    transition: 0.4s;
    animation: fadeUp 1s ease;
}

.card:hover {
    transform: translateY(-10px) scale(1.02);
    background: rgba(255,255,255,0.16);
    box-shadow: 0 15px 35px rgba(0,0,0,0.35);
}

.icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.card h2 {
    margin-bottom: 12px;
    color: #ffd700;
}

.card p {
    color: #ddd;
    line-height: 1.6;
    margin-bottom: 20px;
}

/* BUTTON */

.btn {
    display: inline-block;
    padding: 11px 20px;
    background: linear-gradient(45deg, #ff9800, #ffd700);
    color: #111;
    text-decoration: none;
    font-weight: bold;
    border-radius: 25px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.08);
    box-shadow: 0 5px 15px rgba(255,193,7,0.4);
}

/* QUOTE */

.quote {
    max-width: 850px;
    margin: 50px auto;
    padding: 30px;
    text-align: center;
    border-radius: 20px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.10);
}

.quote h2 {
    color: #ffd700;
    margin-bottom: 10px;
}

.quote p {
    color: #ddd;
    font-size: 17px;
}

/* FOOTER */

footer {
    margin-top: 50px;
    padding: 25px;
    text-align: center;
    background: rgba(0,0,0,0.45);
    color: #ccc;
}

footer span {
    color: #ff9800;
}

/* ANIMATIONS */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes fadeDown {

    from {
        opacity: 0;
        transform: translateY(-30px);
    }
