 <!DOCTYPE html>
<html lang="en">

<head>

<title>My Computer World | Anuj Maurya</title>

<style>

/* =========================
   BASIC
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

:root {
    --bg1: #141e30;
    --bg2: #243b55;
    --card: rgba(255,255,255,0.10);
    --text: white;
    --accent: #ffd700;
    --button: #ff9800;
}

body.light {
    --bg1: #eaf2ff;
    --bg2: #c9dcf5;
    --card: rgba(255,255,255,0.75);
    --text: #172033;
    --accent: #d68900;
    --button: #ff9800;
}

body {

    font-family: Arial, sans-serif;

    color: var(--text);

    background:
        linear-gradient(135deg, var(--bg1), var(--bg2));

    min-height: 100vh;

    overflow-x: hidden;

    transition: 0.4s;
}


/* =========================
   ANIMATED BACKGROUND
========================= */

.background {

    position: fixed;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    overflow: hidden;

    z-index: -1;
}

.circle {

    position: absolute;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background: rgba(255,255,255,0.08);

    animation: moveCircle 12s infinite linear;
}

.circle:nth-child(1) {
    left: 10%;
    top: 20%;
    animation-duration: 14s;
}

.circle:nth-child(2) {
    left: 70%;
    top: 10%;
    width: 180px;
    height: 180px;
    animation-duration: 18s;
}

.circle:nth-child(3) {
    left: 50%;
    top: 70%;
    width: 100px;
    height: 100px;
    animation-duration: 11s;
}

.circle:nth-child(4) {
    left: 85%;
    top: 65%;
    width: 150px;
    height: 150px;
    animation-duration: 16s;
}

@keyframes moveCircle {

    0% {
        transform: translate(0,0) rotate(0deg);
    }

    50% {
        transform: translate(80px,-60px) rotate(180deg);
    }

    100% {
        transform: translate(0,0) rotate(360deg);
    }
}


/* =========================
   NAVBAR
========================= */

nav {

    position: sticky;

    top: 0;

    z-index: 1000;

    padding: 15px;

    text-align: center;

    background: rgba(0,0,0,0.45);

    backdrop-filter: blur(12px);
}

nav a {

    color: white;

    text-decoration: none;

    margin: 0 9px;

    font-weight: bold;

    transition: 0.3s;
}

nav a:hover {

    color: var(--accent);

    text-shadow:
        0 0 10px var(--accent);
}


/* =========================
   MODE BUTTON
========================= */

.mode-btn {

    position: fixed;

    right: 20px;

    top: 70px;

    z-index: 1001;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    font-size: 20px;

    background: var(--accent);

    box-shadow:
        0 0 15px rgba(255,215,0,0.5);
}


/* =========================
   HERO
========================= */

.hero {

    text-align: center;

    padding: 80px 20px 50px;

    animation: heroAppear 1.2s ease;
}

@keyframes heroAppear {

    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.hero h1 {

    font-size: 45px;

    margin-bottom: 15px;
}

.hero h1 span {

    color: var(--accent);

    text-shadow:
        0 0 15px rgba(255,215,0,0.5);
}

.hero p {

    font-size: 18px;

    line-height: 1.8;
}


/* =========================
   PROFILE PHOTO
========================= */

.photo-box {

    width: 190px;

    height: 190px;

    margin: 30px auto;

    padding: 6px;

    border-radius: 50%;

    background:
        linear-gradient(
            45deg,
            #ffd700,
            #ff9800,
            #00d4ff,
            #ffd700
        );

    animation:
        gradientMove 5s infinite linear,
        floating 3s infinite ease-in-out;

    box-shadow:
        0 0 30px rgba(255,215,0,0.5);
}
